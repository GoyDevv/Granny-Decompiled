name: Build Godot 4.7 Android APK

on:
  push:
    branches: [master]
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'ci/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GODOT_CONVERT_VERSION: 4.2.2
      GODOT_FINAL_VERSION: 4.7.2
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Checkout Unity source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install base packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync openjdk-17-jdk-headless

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L --fail --retry 3 -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Download Godot 4.2.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot-convert.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_CONVERT_VERSION}-stable/Godot_v${GODOT_CONVERT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-convert.zip -d /opt/godot-convert
          chmod +x /opt/godot-convert/Godot_v${GODOT_CONVERT_VERSION}-stable_linux.x86_64
          ln -sf /opt/godot-convert/Godot_v${GODOT_CONVERT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot-convert

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot-final.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_FINAL_VERSION}-stable/Godot_v${GODOT_FINAL_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-final.zip -d /opt/godot-final
          chmod +x /opt/godot-final/Godot_v${GODOT_FINAL_VERSION}-stable_linux.x86_64
          ln -sf /opt/godot-final/Godot_v${GODOT_FINAL_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download FBX2glTF for legacy Unidot
        run: |
          mkdir -p conversion/tools/fbx2gltf
          curl -L --fail --retry 3 -o /tmp/fbx2gltf.zip \
            https://github.com/godotengine/FBX2glTF/releases/download/v0.13.1/FBX2glTF-linux-x86_64.zip
          unzip -q /tmp/fbx2gltf.zip -d conversion/tools/fbx2gltf
          FBX_BIN="$(find conversion/tools/fbx2gltf -type f \( -name 'FBX2glTF-linux-x86_64' -o -name 'FBX2glTF' \) | head -1)"
          test -n "$FBX_BIN"
          chmod +x "$FBX_BIN"
          echo "FBX2GLTF_PATH=$(realpath "$FBX_BIN")" >> "$GITHUB_ENV"

      - name: Prepare Godot project
        run: |
          mkdir -p conversion/UnitySource
          rsync -a --delete Assets/ conversion/UnitySource/Assets/
          git clone --depth 1 https://github.com/V-Sekai/unidot_importer.git conversion/addons/unidot_importer
          cat > conversion/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Granny Forsaken Godot"
          config/features=PackedStringArray("4.2", "GL Compatibility")

          [editor_plugins]
          enabled=PackedStringArray("res://addons/unidot_importer/plugin.cfg")

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp ci/godot/unidot_headless.gd conversion/ci_unidot_headless.gd

      - name: Convert Unity assets to Godot resources
        working-directory: conversion
        env:
          FBX2GLTF_PATH: ${{ env.FBX2GLTF_PATH }}
        run: godot-convert --headless --editor --path . --script ci_unidot_headless.gd

      - name: Find gameplay scene
        id: scene
        run: |
          SCENE="$(find conversion -type f -path '*Scene/1_Scenes/Scene.tscn' | head -1 || true)"
          if [ -z "$SCENE" ]; then SCENE="$(find conversion -type f -name 'Scene.tscn' | head -1 || true)"; fi
          test -n "$SCENE"
          echo "path=${SCENE#conversion/}" >> "$GITHUB_OUTPUT"
          sed -i "s#^run/main_scene=.*#run/main_scene=\"res://${SCENE#conversion/}\"#" conversion/project.godot || true

      - name: Upgrade project with Godot 4.7.2
        working-directory: conversion
        run: godot --headless --editor --path . --quit-after 20

      - name: Write Android export preset
        working-directory: conversion
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=1

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          architecture/x86=false
          architecture/x86_64=false
          package/unique_name="com.goydevv.grannyforsaken.godot"
          package/name="Granny Forsaken Godot"
          package/signed=true
          package/keystore/debug=""
          package/keystore/debug_user="androiddebugkey"
          package/keystore/debug_password="android"
          package/keystore/release=""
          package/keystore/release_user=""
          package/keystore/release_password=""
          version/code=1
          version/name="1.0"
          screen/immersive_mode=true
          screen/orientation=1
          permissions/internet=false
          EOF

      - name: Export Godot Android APK
        working-directory: conversion
        run: |
          mkdir -p build/android
          godot --headless --path . --editor --quit-after 20
          godot --headless --path . --export-debug Android build/android/Granny-Forsaken-Godot.apk
          test -s build/android/Granny-Forsaken-Godot.apk

      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: granny-forsaken-godot-android-apk
          path: conversion/build/android/Granny-Forsaken-Godot.apk
          if-no-files-found: error
          retention-days: 14
