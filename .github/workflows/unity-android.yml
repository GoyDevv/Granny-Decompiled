name: Build Unity Android APK

on:
  push:
    branches: [master]
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'ProjectSettings/ProjectVersion.txt'
      - '.github/workflows/unity-android.yml'
      - '.github/unity/2018.2.19f1-android-gameci.Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Unity project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space for Unity Android build
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-Android-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Unity-Library-Android-
            Unity-Library-

      - name: Build Unity 2018.2 Android compatibility image
        run: |
          docker build \
            --file .github/unity/2018.2.19f1-android-gameci.Dockerfile \
            --tag granny-unityci:2018.2.19f1-android-3 \
            .

      - name: Build Android APK with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          customImage: granny-unityci:2018.2.19f1-android-3
          androidExportType: androidPackage
          buildName: Granny-Forsaken
          customParameters: '-quit -batchmode'

      - name: Verify APK exists
        run: |
          find build -type f -name '*.apk' -print
          test -n "$(find build -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: granny-forsaken-android-apk
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14

# CI fix: Unity 2018.2 image needs GameCI v4 editor metadata for Android SDK discovery.
