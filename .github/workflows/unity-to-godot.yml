name: Unity -> Godot 4.7

on:
  push:
    branches: [master, 'ci/**']
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - 'Packages/**'
      - 'ci/**'
      - '.github/workflows/unity-to-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GODOT_CONVERT_VERSION: 4.2.2
      GODOT_FINAL_VERSION: 4.7.2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Audit Unity GUID dependencies
        run: |
          mkdir -p conversion/audit
          python3 ci/conversion/audit_unity_refs.py --assets Assets --out conversion/audit || true

      - name: Upload Unity source audit
        uses: actions/upload-artifact@v4
        with:
          name: granny-unity-guid-audit
          path: conversion/audit
          if-no-files-found: error
          retention-days: 14

      - name: Download Godot 4.2.2 for Unidot
        run: |
          curl -L --fail --retry 3 -o /tmp/godot-convert.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_CONVERT_VERSION}-stable/Godot_v${GODOT_CONVERT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-convert.zip -d /opt/godot-convert
          chmod +x /opt/godot-convert/Godot_v${GODOT_CONVERT_VERSION}-stable_linux.x86_64
          ln -sf /opt/godot-convert/Godot_v${GODOT_CONVERT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot-convert

      - name: Download Godot 4.7.2 for final project
        run: |
          curl -L --fail --retry 3 -o /tmp/godot-final.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_FINAL_VERSION}-stable/Godot_v${GODOT_FINAL_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-final.zip -d /opt/godot-final
          chmod +x /opt/godot-final/Godot_v${GODOT_FINAL_VERSION}-stable_linux.x86_64
          ln -sf /opt/godot-final/Godot_v${GODOT_FINAL_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download legacy FBX2glTF for Unidot
        run: |
          mkdir -p conversion/tools/fbx2gltf
          curl -L --fail --retry 3 -o /tmp/fbx2gltf.zip \
            https://github.com/godotengine/FBX2glTF/releases/download/v0.13.1/FBX2glTF-linux-x86_64.zip
          unzip -q /tmp/fbx2gltf.zip -d conversion/tools/fbx2gltf
          FBX_BIN="$(find conversion/tools/fbx2gltf -type f \( -name 'FBX2glTF-linux-x86_64' -o -name 'FBX2glTF' \) | head -1)"
          test -n "$FBX_BIN"
          chmod +x "$FBX_BIN"
          echo "FBX2GLTF_PATH=$(realpath "$FBX_BIN")" >> "$GITHUB_ENV"

      - name: Create temporary Godot conversion project
        run: |
          mkdir -p conversion/UnitySource
          rsync -a --delete Assets/ conversion/UnitySource/Assets/
          git clone --depth 1 https://github.com/V-Sekai/unidot_importer.git conversion/addons/unidot_importer
          cat > conversion/project.godot <<'EOF'
          ; Auto-generated CI host project for Unidot conversion.
          ; The converted result is upgraded to Godot 4.7.2 after import.
          config_version=5

          [application]
          config/name="Granny Godot Port"
          config/features=PackedStringArray("4.2", "GL Compatibility")

          [editor_plugins]
          enabled=PackedStringArray("res://addons/unidot_importer/plugin.cfg")

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp ci/godot/unidot_headless.gd conversion/ci_unidot_headless.gd

      - name: Convert Unity assets with hardened Unidot importer
        working-directory: conversion
        env:
          FBX2GLTF_PATH: ${{ env.FBX2GLTF_PATH }}
        run: |
          godot-convert --headless --editor --path . --script ci_unidot_headless.gd

      - name: Select converted gameplay scene
        run: |
          SCENE="$(find conversion -type f -path '*Scene/1_Scenes/Scene.tscn' | head -1 || true)"
          if [ -z "$SCENE" ]; then
            SCENE="$(find conversion -type f -name 'Scene.tscn' | head -1 || true)"
          fi
          test -n "$SCENE"
          REL="${SCENE#conversion/}"
          echo "Converted scene: $REL"
          if grep -q '^run/main_scene=' conversion/project.godot; then
            sed -i "s#^run/main_scene=.*#run/main_scene=\"res://$REL\"#" conversion/project.godot
          else
            printf '\n[application]\nrun/main_scene="res://%s"\n' "$REL" >> conversion/project.godot
          fi

      - name: Let Godot 4.7.2 open and upgrade the converted project
        working-directory: conversion
        run: |
          godot --headless --editor --path . --quit-after 20

      - name: Add migration notes
        run: |
          cat > conversion/GODOT_MIGRATION.md <<'EOF'
          # Granny -> Godot 4.7 migration

          This project was translated from the decompiled Unity source with Unidot  and the hardened headless importer, then opened with Godot 4.7.2.

          The CI importer explicitly waits for Godot filesystem scans before and after Unidot conversion and records a Unity GUID dependency audit.

          Unidot still cannot port Unity gameplay scripts/shaders automatically. The goal of this artifact is an accurate scene/asset foundation for the Godot rework.
          EOF

      - name: Package converted Godot project
        run: |
          rm -rf conversion/.godot conversion/tools/fbx2gltf
          tar -czf /tmp/granny-godot-4.7.2.tar.gz -C conversion .

      - name: Upload Godot project
        uses: actions/upload-artifact@v4
        with:
          name: granny-godot-4.7.2
          path: /tmp/granny-godot-4.7.2.tar.gz
          if-no-files-found: error
          retention-days: 14
